<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <!-- Permite cargar imágenes externas sin bloqueo de servidor (Referrer) -->
        <meta name="referrer" content="no-referrer">

        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #6ab87f!important;
            color: #ffffff!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #ffffff!important;
        }
        .search-layer-input-search {
            background-color: #6ab87f!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(106, 184, 127, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Geovisor diversidad de vertebrados terrestres de la cuenca del río Gaira</title>
    </head>
    <body>
        <!-- Contenedor del Mapa -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Banner Flotante Fijo (Fuera del mapa para evitar parpadeo) -->
        <div id="biota-banner" style="
            position: fixed;
            bottom: 20px;
            left: 15px;
            z-index: 9999;
            background: linear-gradient(135deg, #2eac66, #1b8a4f);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.35);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.25);
            max-width: 360px;
            pointer-events: auto;
        ">
            <!-- Logo Biota SIG -->
            <img src="images/logo.png" alt="Logo Biota" style="
                height: 40px;
                width: auto;
                object-fit: contain;
                background: #ffffff;
                padding: 3px;
                border-radius: 5px;
            " onerror="this.src='logo.png'; this.onerror=null;">

            <!-- Textos del Banner -->
            <div>
                <h2 style="
                    margin: 0;
                    font-size: 13px;
                    font-weight: 700;
                    line-height: 1.2;
                    color: #ffffff;
                    letter-spacing: 0.3px;
                ">GEOVISOR DE BIODIVERSIDAD</h2>

                <span style="
                    font-size: 10.5px;
                    color: #8df8a5;
                    font-weight: 600;
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                    display: block;
                    margin-top: 1px;
                ">Cuenca del Río Gaira • Biota SIG</span>

                <p style="
                    margin: 3px 0 0 0;
                    font-size: 9.5px;
                    line-height: 1.25;
                    color: #e0f8e7;
                    font-weight: 400;
                ">Análisis espacial de riqueza de especies e inventario biológico estructurado en la cuenca hidrográfica.</p>
            </div>
        </div>

        <!-- Scripts de OpenLayers y qgis2web -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:3857','+proj=merc +a=6378137 +b=6378137 +lat_ts=0 +lon_0=0 +x_0=0 +y_0=0 +k=1 +units=m +nadgrids=@null +wktext +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/CuencadelroGaira_1.js"></script>
        <script src="layers/Diversidad_2.js"></script>
        <script src="layers/Drenajes_3.js"></script>
        <script src="layers/Especies_4.js"></script>
        <script src="styles/CuencadelroGaira_1_style.js"></script>
        <script src="styles/Diversidad_2_style.js"></script>
        <script src="styles/Drenajes_3_style.js"></script>
        <script src="styles/Especies_4_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- Conversor automático de URLs a Imágenes dentro de las ventanas emergentes -->
        <script>
            window.addEventListener('load', function() {
                var container = document.getElementById('popup-content');
                if (container) {
                    var observer = new MutationObserver(function() {
                        // Busca enlaces web (a) y texto plano con URLs de imágenes dentro del pop-up
                        var links = container.querySelectorAll('a');
                        links.forEach(function(link) {
                            var href = link.getAttribute('href') || link.innerText;
                            if (href && (href.match(/\.(jpeg|jpg|gif|png)/i) || href.includes('inaturalist') || href.includes('http'))) {
                                var img = document.createElement('img');
                                img.src = href;
                                img.style.width = '100%';
                                img.style.maxWidth = '220px';
                                img.style.borderRadius = '6px';
                                img.style.marginTop = '6px';
                                img.style.display = 'block';
                                link.parentNode.replaceChild(img, link);
                            }
                        });
                    });
                    observer.observe(container, { childList: true, subtree: true });
                }
            });
        </script>
    </body>
</html>
